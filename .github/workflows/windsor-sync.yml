name: Windsor to Firestore

on:
  schedule:
    - cron: '0 19 * * *' # 22:00 Asia/Riyadh, once daily
  workflow_dispatch:
    inputs:
      date_from:
        description: 'Optional reconciliation start (YYYY-MM-DD); default previous month'
        required: false
      date_to:
        description: 'Optional reconciliation end (YYYY-MM-DD); default today'
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: windsor-firestore-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'shabih11/rev4' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check Windsor credential
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: node -e 'if (!process.env.WINDSOR_API_KEY) { console.error("Add WINDSOR_API_KEY to repository Actions secrets"); process.exit(1); }'
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: iamspec
          workload_identity_provider: projects/16910957582/locations/global/workloadIdentityPools/rev4-github/providers/github
          service_account: rev4-windsor-sync@iamspec.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
          access_token_lifetime: 900s
      - name: Import changed reviews
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          WINDSOR_DATE_FROM: ${{ inputs.date_from }}
          WINDSOR_DATE_TO: ${{ inputs.date_to }}
        run: node automation/windsor-sync.mjs
      - name: Prepare daily display summary
        if: always() && steps.auth.outcome == 'success'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node automation/daily-read-model.mjs
